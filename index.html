<style>
:root{--navy:#14213D;--navy2:#1f2f55;--gold:#FCA311;--grey:#E5E5E5;--line:#3a4a72}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--navy);color:#fff;font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit}
.scr{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px;position:relative}
.scr.on{display:flex}
.box{width:100%;max-width:420px;text-align:center}
.ic{width:56px;height:56px;border-radius:16px;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:26px}
h1{margin:0 0 4px;font-size:21px;font-weight:800}
h1 span{color:var(--gold)}
.logo{display:block;width:230px;max-width:80%;height:auto;margin:0 auto 18px}
.sub{margin:0 0 20px;font-size:13px;opacity:.75}
#pw{width:100%;height:48px;border-radius:12px;border:0;padding:0 14px;font-size:16px;margin-bottom:10px;color:var(--navy)}
.btn{width:100%;height:48px;border:0;border-radius:12px;background:var(--gold);color:var(--navy);font-weight:800;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.err{color:#ffb4a8;font-size:13px;min-height:18px;margin-top:8px}
.foot{margin-top:26px;font-size:11px;opacity:.55;line-height:1.5}
.lk{position:absolute;right:16px;top:16px;border:1px solid var(--line);background:transparent;color:#dfe4ee;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--navy);border:0;border-radius:18px;padding:18px 18px 16px;margin-bottom:12px;cursor:pointer;border-bottom:5px solid var(--gold);box-shadow:0 6px 18px rgba(0,0,0,.22)}
.opt:active{transform:scale(.99)}
.opt .t{font-weight:800;font-size:19px;display:flex;align-items:center;gap:10px}
.opt .t i{font-style:normal;width:38px;height:38px;border-radius:11px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:19px}
.opt .d{font-size:12.5px;color:#5b6478;margin-top:8px;line-height:1.45}
.opt .go{display:inline-block;margin-top:12px;background:var(--gold);color:var(--navy);font-weight:800;font-size:13px;border-radius:10px;padding:8px 14px}
.opt[disabled]{opacity:.55}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#000;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
</style>
</head>

<script>
(function(){
var Q=window.__QB=window.__QB||{pw:null,ok:{},files:null,shell:null,ready:null};
if(!Q.shell){Q.shell='<!DOCTYPE html>\n'+document.documentElement.outerHTML;}
var $=function(s){return document.querySelector(s)};
var SRC={life:'hibah.html',med:'medical.html'};
var TITLE={life:'Bank Quotation Hibah Takaful',med:'Bank Quotation Medical Card'};
document.querySelectorAll('.yr').forEach(function(e){e.textContent=new Date().getFullYear()});
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},2600);}
function show(id){document.querySelectorAll('.scr').forEach(function(s){s.classList.toggle('on',s.id===id)});}

/* ---- muat fail dashboard (sekali sahaja) ---- */
if(!Q.ready){
  Q.ready=Promise.all([fetch(SRC.life).then(function(r){if(!r.ok)throw 0;return r.text()}),fetch(SRC.med).then(function(r){if(!r.ok)throw 0;return r.text()})])
    .then(function(a){Q.files={life:a[0],med:a[1]};});
}
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)});}
var WR=JSON.parse(document.getElementById('wr').textContent);
/* nombor tempoh password, ikut waktu Malaysia (UTC+8): 1 = sehingga 31 Dis 2026; 2 = Jan-Feb 2027; 3 = Mac-Apr 2027; dst. */
function periodNo(){var d=new Date(Date.now()+8*3600e3),y=d.getUTCFullYear(),m=d.getUTCMonth();if(y<2027)return 1;return 2+Math.floor(((y-2027)*12+m)/2);}
function unwrap(pw){
  var n=periodNo(),w=null;for(var i=0;i<WR.w.length;i++){if(WR.w[i].p===n){w=WR.w[i];break;}}
  if(!w)return Promise.resolve({none:true});
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey'])
   .then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(w.s),iterations:WR.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);})
   .then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(w.i)},key,b64(w.c));})
   .then(function(buf){return {s:new TextDecoder().decode(buf)};},function(){return {bad:true};});
}

/* ---- injected ke dalam dashboard asal ---- */
function boot(k){
  return '(function(){var Q=window.__QB,k="'+k+'";'+
  'var ov=document.createElement("div");ov.style.cssText="position:fixed;inset:0;z-index:2147483000;background:#14213D;color:#fff;display:flex;align-items:center;justify-content:center;font:700 15px Plus Jakarta Sans,system-ui,sans-serif";ov.textContent="Membuka…";document.body.appendChild(ov);'+
  'var pwEl=document.getElementById("pw"),form=document.getElementById(k==="life"?"lform":"lockform");'+
  'pwEl.value=Q.pw;form.dispatchEvent(new Event("submit",{cancelable:true,bubbles:true}));'+
  'var t0=Date.now(),lk=document.getElementById("lock"),er=document.getElementById(k==="life"?"lerr":"pwerr");'+
  '(function chk(){var hid=k==="life"?lk.classList.contains("hide"):lk.style.display==="none";if(hid||(er&&er.textContent)||Date.now()-t0>12000){ov.remove();return;}setTimeout(chk,100);})();'+
  'var r=document.getElementById("relock");if(r){var n=r.cloneNode(true);r.parentNode.replaceChild(n,r);n.onclick=function(){Q.pw=null;Q.ok={};Q.go();};}'+
  'var m=document.getElementById("qb-menu");if(m)m.onclick=function(){Q.go();};'+
  'var it;function idle(){clearTimeout(it);it=setTimeout(function(){Q.pw=null;Q.ok={};Q.go();},19*60*1000);}'+
  '["click","keydown","touchstart","scroll"].forEach(function(e){document.addEventListener(e,idle,{passive:true});});idle();'+
  '})();';
}
var BAR='<div id="qb-bar" style="background:#0d1730;padding:6px 14px;border-bottom:1px solid #22304f"><button id="qb-menu" type="button" style="background:none;border:0;color:#FCA311;font:700 12.5px \'Plus Jakarta Sans\',system-ui,sans-serif;cursor:pointer;padding:4px 0">‹ Tukar bank quotation</button></div>';

function wipe(){var id=setTimeout(function(){},0);for(var i=0;i<=id;i++){clearTimeout(i);clearInterval(i);}}
Q.go=function(){wipe();document.open();document.write(Q.shell);document.close();};

function openDash(k){
  var h=Q.files[k];
  h=h.replace('<body>','<body>'+BAR);
  var i=h.lastIndexOf('</body>');
  h=h.slice(0,i)+'<script>'+boot(k)+'<\/script>'+h.slice(i);
  wipe();
  document.open();document.write(h);document.close();
}

/* ---- lock ---- */
var fails=0,waitUntil=0;
$('#lform').addEventListener('submit',function(e){
  e.preventDefault();
  if(Date.now()<waitUntil){$('#lerr').textContent='Tunggu '+Math.ceil((waitUntil-Date.now())/1000)+' saat';return;}
  var pw=$('#pw').value;if(!pw)return;
  $('#pwb').disabled=true;$('#pwb').textContent='Membuka…';$('#lerr').textContent='';
  Q.ready.then(function(){return unwrap(pw);}).then(function(r){
    if(r.s){Q.pw=r.s;Q.ok={life:true,med:true};fails=0;$('#pw').value='';menu();}
    else if(r.none){$('#lerr').textContent='Password untuk tempoh ini belum disediakan. Hubungi admin.';}
    else{fails++;if(fails>=5)waitUntil=Date.now()+30000*Math.pow(2,fails-5);$('#lerr').textContent='Password salah'+(fails>=5?' \u2014 cuba lagi sebentar':'');}
  },function(){$('#lerr').textContent='Gagal muat data. Cuba refresh halaman.';}).then(function(){$('#pwb').disabled=false;$('#pwb').textContent='Buka';});
});
function menu(){show('s-menu');}
document.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
  var k=b.dataset.k;
  if(!Q.ok[k]){toast('Password ini tak sepadan dengan '+(k==='life'?'Hibah Takaful':'Medical Card'));return;}
  openDash(k);
};});
$('#mlock').onclick=function(){Q.pw=null;Q.ok={};show('s-lock');setTimeout(function(){$('#pw').focus()},50);};

if(Q.pw&&Q.files){menu();}else{show('s-lock');setTimeout(function(){$('#pw').focus()},100);}
})();
</script>
